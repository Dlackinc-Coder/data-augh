seed: 42
ckpt_dir: checkpoints/exp_unet_effb0_v2

dataset:
  root: "data/mouse_cardiac"
  tile_size: 512
  stride: 512
  tiles_per_image: 8

model:
  name: "unet"
  encoder: "efficientnet-b0"
  encoder_weights: "imagenet"
  freeze_encoder_epochs: 15
  classes: 4

train:
  epochs: 200
  optimizer: "adamw"
  lr: 0.0003
  weight_decay: 0.0001
  scheduler: "cosine"
  warmup_epochs: 5
  amp: true
  precision: "bf16"
  batch_size: 2
  grad_accum: 4
  num_workers: 4
  log_dir: "runs/exp_unet_effb0_v2"

loss:
  type: "dice_ce"
  dice_weight: 1.0
  ce_weight: 1.0
  class_weights: [0.1, 1.0, 1.0, 1.0]

output:
  ckpt_dir: "checkpoints/exp_unet_effb0_v2"
