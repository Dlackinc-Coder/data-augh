model:
  name: "litemedsam"
  classes: 4
  pretrained_checkpoint: "checkpoints/lite_medsam.pth"
  freeze_encoder_epochs: 15

dataset:
  root: "data/mouse_cardiac"
  tile_size: 1024
  tiles_per_image: 8

train:
  epochs: 100
  optimizer: "adamw"
  lr: 0.0003
  weight_decay: 0.0001
  scheduler: "cosine"
  amp: true
  gradient_checkpointing: false
  batch_size: 4
  grad_accum: 2
  num_workers: 4
  log_dir: "runs/exp_litemedsam_1024"

loss:
  type: "dice_ce"
  dice_weight: 1.0
  ce_weight: 1.0
  class_weights: [0.1, 1.0, 1.0, 1.0]

output:
  ckpt_dir: "checkpoints/exp_litemedsam_1024"
