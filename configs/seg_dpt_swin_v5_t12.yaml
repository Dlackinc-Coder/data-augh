# G-v5: receta G-v3 con mas muestras por epoca (tiles_per_image 8 -> 12).
# Palanca "sampling": +50% ventanas/epoca (mismo calendario de LR); las
# epocas tardan ~1.4x. Alternativa mas barata: subir epochs en G-v3, pero
# esta version mide tiles/epoch como factor independiente. Fase 3, 16-oct.
seed: 42
ckpt_dir: checkpoints/exp_dpt_swin_v5_t12

dataset:
  root: "data/mouse_cardiac"
  tile_size: 512
  stride: 512
  tiles_per_image: 12
  aug_version: 2

model:
  name: "dpt"
  encoder: "tu-swin_tiny_patch4_window7_224"
  encoder_weights: "imagenet"
  encoder_kwargs: {img_size: 512}
  readout: "ignore"
  classes: 4

train:
  epochs: 300
  optimizer: "adamw"
  lr: 0.0003
  llrd: true
  llrd_decay: 0.75
  weight_decay: 0.0001
  scheduler: "cosine"
  warmup_epochs: 10
  amp: true
  precision: "bf16"
  batch_size: 2
  grad_accum: 4
  num_workers: 4
  log_dir: "runs/exp_dpt_swin_v5_t12"
  save_every: 50

loss:
  type: "dice_ce"
  dice_weight: 1.0
  ce_weight: 1.0
  class_weights: [0.1, 1.0, 1.0, 1.0]

output:
  ckpt_dir: checkpoints/exp_dpt_swin_v5_t12
