seed: 42
ckpt_dir: checkpoints/exp_manet

dataset:
  root: data/mouse_cardiac
  tile_size: 512
  stride: 512
  tiles_per_image: 8

model:
  name: manet
  encoder: efficientnet-b0
  encoder_weights: imagenet
  classes: 4

train:
  batch_size: 2
  grad_accum: 4
  epochs: 100
  lr: 0.0003
  weight_decay: 0.0001
  label_smoothing: 0.0
  num_workers: 4
  log_dir: runs/exp_manet
